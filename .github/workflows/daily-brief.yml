name: Ticker Brief source check

# The Codex daily 13:00 London automation owns publication. This manual job
# verifies the source without creating a generic edition or racing it.
on:
  workflow_dispatch:
    inputs:
      session_date:
        description: Completed NYSE session to verify (YYYY-MM-DD)
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate completed daily bars
        env:
          SESSION_DATE: ${{ inputs.session_date }}
        run: python3 session_snapshot.py --date "$SESSION_DATE"
      - name: Validate existing editions
        run: python3 build.py --check
