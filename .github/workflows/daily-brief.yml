name: Daily Ticker Brief
on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch prices, news context, and earnings watch
        run: python daily_brief.py
      - name: Validate and rebuild site
        run: python build.py --check && python build.py
      - name: Commit and publish with retry
        shell: bash
        run: |
          git config user.name 'ticker-brief bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'brief: publish daily edition'
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "publish attempt $attempt failed; retrying"
            git rebase --abort || true
            sleep 10
          done
          exit 1
