name: Live chart refresh
on:
  schedule:
    - cron: "4,14,24,34,44,54 13-21 * * 1-5"
    - cron: "4 12 * * 0,6"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: charts-live
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh all charts
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
        run: python refresh_live.py
      - name: Commit live data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add charts
          git diff --cached --quiet && exit 0
          git commit -m "Refresh all chart data"
          for attempt in 1 2 3 4; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

