    return stamp.length > 10 ? stamp.slice(11, 16) : stamp.slice(5);

    var priceH = (H - PADT - PADB) * (1 - VOLH) - GAPV;
    var volTop = PADT + priceH + GAPV;
    var volH = (H - PADT - PADB) - priceH - GAPV;

    bars.forEach(function (b) {
