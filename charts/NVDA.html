    var g = geom(), r = cv.getBoundingClientRect();
    var i = Math.floor((clientX - r.left) / g.step);
    return i < 0 ? 0 : i >= g.bars.length ? g.bars.length - 1 : i;
  }

  cv.addEventListener('mousemove', function (e) { hover = at(e.clientX); draw(); });
  cv.addEventListener('mouseleave', function () { hover = null; draw(); });
  cv.addEventListener('touchstart', function (e) {
    hover = at(e.touches[0].clientX); draw();
  }, { passive: true });
  cv.addEventListener('touchmove', function (e) {
    hover = at(e.touches[0].clientX); draw();
  }, { passive: true });

  // Wheel and pinch zoom over the time axis, clamped to the data.
  cv.addEventListener('wheel', function (e) {
    e.preventDefault();
    var n = view.to - view.from;
    var k = e.deltaY > 0 ? 1.12 : 0.89;
    var want = Math.round(n * k);
    want = Math.max(12, Math.min(D.length, want));
    var anchor = view.from + Math.round(n * ((e.clientX - cv.getBoundingClientRect().left) / W));
    var from = Math.round(anchor - (anchor - view.from) * (want / n));
    from = Math.max(0, Math.min(D.length - want, from));
    view = { from: from, to: from + want };
    draw();
  }, { passive: false });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      e.preventDefault();
      var g = geom();
      if (hover === null) hover = g.bars.length - 1;
      hover += e.key === 'ArrowRight' ? 1 : -1;
      hover = Math.max(0, Math.min(g.bars.length - 1, hover));
      draw();
    } else if (e.key === '0') { view = { from: 0, to: D.length }; hover = null; draw(); }
  });

  document.getElementById('reset').addEventListener('click', function () {
    view = { from: 0, to: D.length }; hover = null; draw();
  });

  function pick(tf) {
    if (!SERIES[tf]) return;
    TF = tf; D = SERIES[tf];
    view = { from: 0, to: D.length }; hover = null;
    Array.prototype.forEach.call(document.querySelectorAll('.tf'), function (b) {
      var on = b.getAttribute('data-tf') === tf;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    draw();
  }
  Array.prototype.forEach.call(document.querySelectorAll('.tf'), function (b) {
    b.addEventListener('click', function () { pick(b.getAttribute('data-tf')); });
  });
  pick(TF);
  var status = document.createElement('div');
  status.setAttribute('role', 'status');
  document.querySelector('header').appendChild(status);
  var busy = false;
  function refreshLive() {
    if (busy || document.hidden) return;
    busy = true;
    fetch('live/' + encodeURIComponent(TICKER) + '.json', {cache:'no-store'})
      .then(function (r) { if (!r.ok) throw Error('Unavailable'); return r.json(); })
      .then(function (p) {
        if (!p || p.ticker !== TICKER || !p.series) throw Error('Invalid data');
        var next = {};
        Object.keys(SERIES).forEach(function (tf) {
          var rows = p.series[tf];
          if (!Array.isArray(rows) || !rows.length) throw Error('Missing timeframe');
          var last = '';
          rows.forEach(function (r) {
            if (!Array.isArray(r) || r.length !== 6 || typeof r[0] !== 'string' ||
                !/^\d{4}-\d{2}-\d{2}( \d{2}:\d{2}:\d{2})?$/.test(r[0]) || r[0] <= last ||
                !r.slice(1).every(function (v) { return typeof v === 'number' && Number.isFinite(v); }) ||
                Math.min.apply(null,r.slice(1,5)) <= 0 || r[5] < 0 ||
                r[2] < Math.max(r[1],r[3],r[4]) || r[3] > Math.min(r[1],r[4])) throw Error('Invalid bar');
            last = r[0];
          });
          next[tf] = rows[rows.length-1][0] >= SERIES[tf][SERIES[tf].length-1][0] ? rows : SERIES[tf];
        });
        var width = view.to-view.from, atEnd = view.to === D.length, full = view.from === 0 && atEnd;
        SERIES = next; D = SERIES[TF]; hover = null;
        view = full ? {from:0,to:D.length} : atEnd ?
          {from:Math.max(0,D.length-width),to:D.length} :
          {from:Math.min(view.from,Math.max(0,D.length-1)),to:Math.min(view.to,D.length)};
        draw();
        status.textContent = 'Latest minute bar: ' + p.updated + ' ET · checks every minute · data refresh about 10 minutes during market hours';
      }).catch(function () {
        status.textContent = 'Refresh unavailable · showing saved data through ' + D[D.length-1][0];
      }).finally(function () { busy = false; });
  }
  refreshLive(); window.setInterval(refreshLive, 60000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) refreshLive(); });

  // The backing store must follow the element's real box, not a guess made
  // before layout settles. Sizing on load alone leaves the canvas short (a
  // dead band underneath) or tall (a clipped volume panel), depending on
  // which resolves first. Observing the container catches every change,
  // including the flex layout resolving and the window being dragged.
  if (window.ResizeObserver) {
    new ResizeObserver(resize).observe(cv.parentNode);
  } else {
    window.addEventListener('resize', resize);
    window.addEventListener('load', resize);
  }
  resize();
})();
</script>
</body>
</html>
